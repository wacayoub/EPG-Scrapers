name: Arabize current beIN feed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/arabize-bein-current.yml"
      - "tools/bein_arabize.py"
      - "tools/bein_ai_refine.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-feed-publish
  cancel-in-progress: false

jobs:
  arabize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Translate existing feed only
        run: |
          mkdir -p output/final reports data
          python tools/bein_arabize.py \
            --input feeds/bein.xml.gz \
            --output output/final/bein.ar.xml.gz \
            --cache data/bein_translation_cache.json \
            --report reports/bein-translation.json
      - name: AI quality pass
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python tools/bein_ai_refine.py \
            --input output/final/bein.ar.xml.gz \
            --output output/final/bein.ai.xml.gz \
            --cache data/bein_ai_cache.json \
            --report reports/bein-ai-refine.json
          if [ -s output/final/bein.ai.xml.gz ]; then
            mv output/final/bein.ai.xml.gz output/final/bein.ar.xml.gz
          fi

      - name: Repack translated feed
        run: |
          python tools/source_feed_pack.py \
            --input output/final/bein.ar.xml.gz \
            --output-gz output/final/bein.xml.gz \
            --output-txt output/final/bein.txt \
            --stats output/final/bein.json \
            --label bein \
            --window-hours 48
      - name: Verify examples
        run: |
          python - <<'PY'
          import gzip, xml.etree.ElementTree as ET, json
          root=ET.fromstring(gzip.decompress(open("output/final/bein.xml.gz","rb").read()))
          targets=["beINSports1.qa@MENA","beINSports2.qa@MENA","beINSports3.qa@MENA","beINSportsNews.qa@SD"]
          for cid in targets:
              rows=[]
              for p in root.findall("programme"):
                  if p.get("channel") != cid:
                      continue
                  title=next(((x.text or "").strip() for x in p.findall("title") if (x.text or "").strip()),"")
                  desc=next(((x.text or "").strip() for x in p.findall("desc") if (x.text or "").strip()),"")
                  rows.append({"start":p.get("start"),"title":title,"desc":desc})
                  if len(rows)>=2: break
              print("AR_BEIN_EXAMPLE",cid,json.dumps(rows,ensure_ascii=False))
          PY
      - name: Publish translated feed
        run: |
          cp output/final/bein.xml.gz feeds/bein.xml.gz
          cp output/final/bein.json feeds/bein.json
          cp output/final/bein.txt feeds/bein.txt
          git config user.name "EPG Scraper Bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds/bein.xml.gz feeds/bein.json feeds/bein.txt reports/bein-translation.json reports/bein-ai-refine.json data/bein_translation_cache.json data/bein_ai_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "Arabize current beIN MENA feed"
            git pull --rebase origin main
            git push
          fi
