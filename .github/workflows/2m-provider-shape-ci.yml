name: 2M nonpublishing live-source HTML shape
on:
  push:
    branches: [feature/2m-sudinfo-shadow-20261017]
    paths:
      - tools/probe_2m_structures_readonly.py
      - .github/workflows/2m-provider-shape-ci.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - name: Structural probe only (read robots.txt first)
        run: python tools/probe_2m_structures_readonly.py
