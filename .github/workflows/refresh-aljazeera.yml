name: EPG 48h - Al Jazeera

on:
  schedule:
    - cron: "0 5,6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/aljazeera_source.py"
      - ".github/workflows/refresh-aljazeera.yml"

permissions:
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: aljazeera
      scheduled: ${{ github.event_name == 'schedule' }}
    secrets: inherit
