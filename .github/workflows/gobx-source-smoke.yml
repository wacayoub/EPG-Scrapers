name: GOBX 2h smoke test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gobx-source-smoke.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gobx-source-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: Verify adapter
        run: python -m py_compile tools/gobx_source.py

      - name: Run one low-rate 2h GOBX smoke test
        shell: bash
        run: |
          set +e
          mkdir -p output/source-build reports
          python tools/gobx_source.py             --output output/source-build/gobx.smoke.xml             --report reports/gobx-smoke.json             --hours 2             --page-size 12             --max-pages 1             --languages ARABIC
          rc=$?
          export GOBX_SMOKE_RC="$rc"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('reports/gobx-smoke.json')
          data=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {}
          data['smoke_exit_code']=int(os.environ['GOBX_SMOKE_RC'])
          data['smoke_policy']='single language, max one guide page, no feed publication'
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(data,ensure_ascii=False,indent=2))
          PY

      - name: Publish smoke report only
        shell: bash
        run: |
          set -e
          git config user.name "epg-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/gobx-smoke.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diagnostic: GOBX 2h source smoke test"
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((n*2))
          done
          exit 1
