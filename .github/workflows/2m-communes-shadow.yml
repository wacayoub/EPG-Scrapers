name: 2M Maroc source integration — shadow no publish
on:
  push:
    branches: [feature/2m-communes-shadow-20261017]
    paths:
      - tools/communesmaroc_2m_shadow.py
      - tools/test_communesmaroc_2m_shadow.py
      - tools/probe_2m_communes_live_shadow.py
      - .github/workflows/2m-communes-shadow.yml
  pull_request:
    paths:
      - tools/communesmaroc_2m_shadow.py
      - tools/test_communesmaroc_2m_shadow.py
      - tools/probe_2m_communes_live_shadow.py
      - .github/workflows/2m-communes-shadow.yml
permissions:
  contents: read
jobs:
  parser-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - run: python -m py_compile tools/communesmaroc_2m_shadow.py tools/test_communesmaroc_2m_shadow.py tools/probe_2m_communes_live_shadow.py
      - run: python -m unittest discover -s tools -p 'test_communesmaroc_2m_shadow.py' -v
  real-source-shadow:
    needs: parser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - run: python tools/probe_2m_communes_live_shadow.py
