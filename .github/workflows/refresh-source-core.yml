name: Refresh one EPG source core

on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      scheduled:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: epg-source-${{ inputs.source }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Casablanca 06:00 gate
        id: gate
        shell: bash
        run: |
          if [ "${{ inputs.scheduled }}" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour="$(TZ=Africa/Casablanca date +%H)"
          if [ "$hour" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skip duplicate UTC slot; Casablanca hour=$hour"
          fi

      - name: Checkout scraper repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine source requirements
        if: steps.gate.outputs.run == 'true'
        id: req
        shell: bash
        run: |
          case "${{ inputs.source }}" in
            bein|osn|shahid|elcinema) echo "upstream=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "upstream=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout iptv-org EPG adapters
        if: steps.gate.outputs.run == 'true' && steps.req.outputs.upstream == 'true'
        uses: actions/checkout@v4
        with:
          repository: iptv-org/epg
          ref: master
          path: vendor/iptv-org-epg
          fetch-depth: 1

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: Set up Node.js
        if: steps.gate.outputs.run == 'true' && steps.req.outputs.upstream == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install upstream EPG grabber
        if: steps.gate.outputs.run == 'true' && steps.req.outputs.upstream == 'true'
        working-directory: vendor/iptv-org-epg
        run: npm ci --no-audit --no-fund

      - name: Build provider catalogues
        if: steps.gate.outputs.run == 'true' && steps.req.outputs.upstream == 'true'
        run: python tools/build_catalogues.py

      - name: Verify refresh scripts
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          bash -n tools/refresh_one_source.sh
          python -m py_compile tools/publish_lkg.py tools/source_feed_pack.py tools/validate_48h.py tools/aljazeera_source.py

      - name: Refresh ${{ inputs.source }} for 48h
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash tools/refresh_one_source.sh "${{ inputs.source }}" 48

      - name: Commit only this source
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -e
          SOURCE="${{ inputs.source }}"
          git config user.name "EPG Source Bot"
          git config user.email "actions@users.noreply.github.com"

          git add "feeds/$SOURCE.xml.gz" "feeds/$SOURCE.txt" "feeds/$SOURCE.json" 2>/dev/null || true
          git add "reports/$SOURCE"*.json "reports/$SOURCE"*.md 2>/dev/null || true

          case "$SOURCE" in
            bein)
              git add reports/bein-translation.json reports/bein-ai-refine.json reports/bein-hybrid.json 2>/dev/null || true
              git add data/bein_translation_cache.json data/bein_ai_cache.json data/bein_hybrid_translation_cache.json 2>/dev/null || true
              ;;
            osn)
              git add reports/osn-hybrid.json 2>/dev/null || true
              ;;
            elcinema)
              git add reports/elcinema-hybrid.json data/elcinema_translation_cache.json 2>/dev/null || true
              ;;
            starzplay)
              git add reports/starzplay-*.json 2>/dev/null || true
              ;;
            gobx)
              git add reports/gobx-*.json reports/gobx-*.md 2>/dev/null || true
              ;;
          esac

          if git diff --cached --quiet; then
            echo "No changes for $SOURCE"
            exit 0
          fi

          git commit -m "EPG $SOURCE 48h refresh $(TZ=Africa/Casablanca date +%F)"

          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((n * 2))
          done
          echo "Could not publish $SOURCE after retries" >&2
          exit 1
