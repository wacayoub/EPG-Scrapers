name: TEMP ElCinema fast repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_tmp-elcinema-fast-repair.yml"

permissions:
  contents: write

concurrency:
  group: epg-source-elcinema
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt

      - name: Apply verified zero-EPG fallbacks
        run: |
          mkdir -p output/final reports
          python tools/elcinema_zero_epg_fallback.py \
            --input feeds/elcinema.xml.gz \
            --output /tmp/elcinema.repaired.xml \
            --report reports/elcinema-zero-epg-fallback.json
          python tools/source_feed_pack.py \
            --input /tmp/elcinema.repaired.xml \
            --output-gz output/final/elcinema.xml.gz \
            --output-txt output/final/elcinema.txt \
            --stats output/final/elcinema.json \
            --label elcinema \
            --window-hours 48
          python tools/validate_48h.py output/final/elcinema.xml.gz \
            --hours 48 --max-gap-minutes 90 \
            --report reports/elcinema-48h-audit.json || true
          python tools/publish_lkg.py --source elcinema \
            --report reports/elcinema-publish-lkg.json
          cat reports/elcinema-zero-epg-fallback.json
          cat feeds/elcinema.json

      - name: Rebuild MENA and monitoring
        run: |
          python tools/build_derived_feeds.py
          shopt -s nullglob
          feeds=(feeds/*.xml.gz)
          python tools/monitor_feeds.py "${feeds[@]}" \
            --json reports/latest.json \
            --md reports/latest.md \
            --html reports/epg-source-id-monitoring.html \
            --csv reports/epg-source-id-monitoring.csv \
            --reports-dir reports

      - name: Publish repaired ElCinema and MENA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPG Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds/elcinema.xml.gz feeds/elcinema.txt feeds/elcinema.json
          git add reports/elcinema-zero-epg-fallback.json reports/elcinema-48h-audit.json reports/elcinema-publish-lkg.json
          git add feeds/mena.xml.gz feeds/mena.txt feeds/mena.json
          git add reports/latest.json reports/latest.md reports/epg-source-id-monitoring.html reports/epg-source-id-monitoring.csv
          git add reports/canonical-source-routing.json reports/canonical-source-routing.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Repair ElCinema zero-EPG fallbacks and rebuild MENA"
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((n * 2))
          done
          exit 1
