name: MENA routing per-ID quality regression (nonpublishing)
on:
  push:
    branches: [fix/mena-reject-flagged-epg-20261017]
    paths:
      - 'tools/derived_source_quality_guard.py'
      - 'tools/build_derived_feeds.py'
      - 'tools/test_derived_source_quality_guard.py'
      - '.github/workflows/mena-source-quality-guard-ci.yml'
  pull_request:
    paths:
      - 'tools/derived_source_quality_guard.py'
      - 'tools/build_derived_feeds.py'
      - 'tools/test_derived_source_quality_guard.py'
      - '.github/workflows/mena-source-quality-guard-ci.yml'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13','3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile tools/derived_source_quality_guard.py tools/build_derived_feeds.py tools/test_derived_source_quality_guard.py
      - run: python -m unittest discover -s tools -p 'test_derived_source_quality_guard.py' -v
  nonpublishing-aggregate:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Capture current public routing for one-to-one comparison
        run: cp reports/canonical-source-routing.json /tmp/mena-routing-public-before.json
      - name: Rebuild MENA only in ephemeral runner checkout, do not git push
        run: python tools/build_derived_feeds.py
      - name: Validate flagged candidates cannot receive green ranking
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/canonical-source-routing.json').read_text())
          allc=[c for row in r['routing'].values() for c in row['candidates']]
          unsafe=[(c['source'],c['id']) for c in allc
                  if c['qualified'] and c['source_evidence']!='NO_PLACEHOLDER_FLAG']
          assert not unsafe,unsafe[:5]
          row=r['routing']['AbuDhabiSports2.ae@SD']
          suspect=[c for c in row['candidates'] if c['source']=='stctv']
          assert len(suspect)==1,suspect
          assert suspect[0]['source_evidence']=='SUSPECT_PLACEHOLDER',suspect
          assert not suspect[0]['qualified'],suspect
          assert row['selected_source']!='stctv',row
          print('MENA_EPISODE_FLAG_GUARD_PASS', 'channels',len(r['routing']),
                'flagged_ranking_blocked',len(unsafe),
                'ad_sports_2_selected_source',row['selected_source'])
          PY
      - name: Show changed MENA owners and avoid empty-feed regressions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path('/tmp/mena-routing-public-before.json').read_text())['routing']
          new=json.loads(Path('reports/canonical-source-routing.json').read_text())['routing']
          changed=[]
          lost=[]
          for cid, previous in old.items():
              current=new.get(cid)
              if current is None:
                  lost.append(cid)
                  continue
              if previous['selected_source'] != current['selected_source']:
                  changed.append({
                      'id':cid,
                      'before':previous['selected_source'],
                      'after':current['selected_source'],
                      'reason':current['selection_reason'],
                      'before_events':next((c['future_programmes'] for c in previous['candidates']
                          if c['source']==previous['selected_source']),0),
                      'after_events':next((c['future_programmes'] for c in current['candidates']
                          if c['source']==current['selected_source']),0)
                  })
          assert not lost,('lost canonical IDs',lost[:8])
          assert len(new)==len(old),(len(old),len(new))
          print('MENA_ROUTING_DELTA',json.dumps({
              'channels':len(new),'changed_source_count':len(changed),
              'changed_first_20':changed[:20],
              'regressed_to_empty':sum(1 for x in changed
                  if x['before_events']>0 and x['after_events']==0),
          },ensure_ascii=False))
          assert not any(x['before_events']>0 and x['after_events']==0
                         for x in changed),'Epg programme owners must never regress to empty'
          PY
