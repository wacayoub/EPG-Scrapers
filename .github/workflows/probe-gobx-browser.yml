name: Focused GOBX browser probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-gobx-browser.yml"
      - "tools/gobx_browser_probe.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gobx-browser-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir playwright
          python -m playwright install --with-deps chromium
      - name: Probe GOBX with real browser
        run: python tools/gobx_browser_probe.py
      - name: Publish report
        if: always()
        shell: bash
        run: |
          git config user.name "epg-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f reports/gobx-browser-probe.json ] && git add reports/gobx-browser-probe.json || true
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "diagnostic: publish focused GOBX browser probe"
            git push
          fi
