name: EPG 48h - Rotana

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/rotana_source.py"
      - ".github/workflows/refresh-rotana.yml"

permissions:
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: rotana
      scheduled: false
    secrets: inherit
