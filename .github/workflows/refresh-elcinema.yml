name: EPG 48h - ElCinema

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/elcinema-language-policy.json'
      - 'tools/elcinema_hybrid.py'
      - 'tools/elcinema_zero_epg_fallback.py'
      - 'tools/refresh_one_source.sh'
      - '.github/workflows/refresh-source-core.yml'
      - '.github/workflows/refresh-elcinema.yml'

permissions:
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: elcinema
      scheduled: false
    secrets: inherit
