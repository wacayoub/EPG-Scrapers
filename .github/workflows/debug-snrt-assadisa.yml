name: Debug current Morocco descriptions

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/debug-snrt-assadisa.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect published SNRT descriptions
        shell: bash
        run: |
          python - <<'PY'
          import gzip, xml.etree.ElementTree as ET
          root=ET.fromstring(gzip.decompress(open("feeds/morocco.xml.gz","rb").read()))
          for cid in ("AlAoula","AlMaghribiya","Assadisa","Arrabiaa","Tamazight"):
              rows=[p for p in root.findall("programme") if p.get("channel")==cid]
              rich=0
              print("\nCHANNEL",cid,"PROGRAMMES",len(rows))
              for p in rows:
                  title=(p.findtext("title") or "").strip()
                  desc=(p.findtext("desc") or "").strip()
                  generic=(not desc or desc==title or desc.startswith("برنامج «") or desc.startswith("نشرة إخبارية على ") or desc.startswith("نشرة الطقس على "))
                  if not generic:rich+=1
              print("RICH_DESC",rich)
              for p in rows[:8]:
                  print("SAMPLE",p.get("start"),"|",(p.findtext("title") or "").strip(),"|",(p.findtext("desc") or "").strip()[:500])
          PY
