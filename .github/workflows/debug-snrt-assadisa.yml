name: Debug SNRT Assadisa DOM

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/debug-snrt-assadisa.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Inspect current Assadisa programme markup
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir requests beautifulsoup4 lxml
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup, Tag

          url="https://www.snrt.ma/ar/mn-dhb-alsyrt"
          r=requests.get(url,timeout=25,headers={
              "User-Agent":"Mozilla/5.0 EPGManagerCloud/8.2.2",
              "Accept-Language":"ar,fr;q=.9,en;q=.7",
              "Cache-Control":"no-cache",
          })
          print("HTTP",r.status_code,"bytes",len(r.text))
          soup=BeautifulSoup(r.text,"lxml")
          print("TITLE", soup.title.get_text(" ",strip=True) if soup.title else "")
          for meta in soup.find_all("meta"):
              name=(meta.get("name") or meta.get("property") or "").lower()
              if "description" in name:
                  print("META",name,":",(meta.get("content") or "")[:2000])
          h1=soup.find("h1")
          print("H1",h1.get_text(" ",strip=True) if h1 else "")
          if h1:
              cur=h1
              for j in range(1,15):
                  cur=cur.find_next()
                  if cur is None:break
                  if isinstance(cur,Tag) and cur.name in ("p","div","section"):
                      txt=cur.get_text(" | ",strip=True)
                      if txt:
                          print("AFTER",j,"name=",cur.name,"class=",cur.get("class"),"text=",txt[:2500])
          rows=[] 
          for n,row in enumerate(rows[:4]):
              print("\n=== ROW",n,"===")
              print(str(row)[:5000])
              print("TEXT:",row.get_text(" | ",strip=True)[:1500])
              cur=row
              for j in range(1,5):
                  cur=cur.find_next_sibling()
                  if cur is None: break
                  if isinstance(cur,Tag):
                      print("SIB",j,"name=",cur.name,"class=",cur.get("class"),"text=",cur.get_text(" | ",strip=True)[:1500])
              p=row.parent
              print("PARENT",getattr(p,"name",None),getattr(p,"attrs",{}))
              if p:
                  for j,ch in enumerate([x for x in p.children if isinstance(x,Tag)][:12]):
                      print("CHILD",j,"name=",ch.name,"class=",ch.get("class"),"text=",ch.get_text(" | ",strip=True)[:1000])
          PY
