name: EPG 48h - STC TV

on:
  # STC remains in the 07:15 GMT+0 sequential source chain.
  # Do not scrape again automatically whenever implementation code changes.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: stctv
      scheduled: false
    secrets: inherit
