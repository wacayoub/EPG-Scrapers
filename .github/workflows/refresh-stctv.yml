name: EPG 48h - STC TV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/stctv_source.py'
      - 'tools/refresh_one_source.sh'
      - '.github/workflows/refresh-stctv.yml'

permissions:
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: stctv
      scheduled: false
    secrets: inherit
