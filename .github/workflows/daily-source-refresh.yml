name: EPG 48h - Daily sequential sources

on:
  schedule:
    - cron: "7 6 * * *"
      timezone: "Africa/Casablanca"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/source-refresh-trigger.txt"

permissions:
  contents: write

concurrency:
  group: epg-daily-sequential
  cancel-in-progress: false

jobs:
  morocco:
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: morocco
      scheduled: false
    secrets: inherit

  alkass:
    needs: morocco
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: alkass
      scheduled: false
    secrets: inherit

  tunisiatv:
    needs: alkass
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: tunisiatv
      scheduled: false
    secrets: inherit

  bein:
    needs: tunisiatv
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: bein
      scheduled: false
    secrets: inherit

  osn:
    needs: bein
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: osn
      scheduled: false
    secrets: inherit

  shahid:
    needs: osn
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: shahid
      scheduled: false
    secrets: inherit

  elcinema:
    needs: shahid
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: elcinema
      scheduled: false
    secrets: inherit

  rotana:
    needs: elcinema
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: rotana
      scheduled: false
    secrets: inherit

  sport24:
    needs: rotana
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: sport24
      scheduled: false
    secrets: inherit

  dubaiplus:
    needs: sport24
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: dubaiplus
      scheduled: false
    secrets: inherit

  aljazeera:
    needs: dubaiplus
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: aljazeera
      scheduled: false
    secrets: inherit

  tabie:
    needs: aljazeera
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: tabie
      scheduled: false
    secrets: inherit


  starzplay:
    needs: tabie
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: starzplay
      scheduled: false
    secrets: inherit

  stctv:
    needs: starzplay
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: stctv
      scheduled: false
    secrets: inherit

  finalize:
    needs: stctv
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build canonical MENA feed
        run: python tools/build_derived_feeds.py

      - name: Build final monitoring dashboard
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          feeds=(feeds/*.xml.gz)
          test "${#feeds[@]}" -gt 0
          python tools/monitor_feeds.py "${feeds[@]}" \
            --json reports/latest.json \
            --md reports/latest.md \
            --html reports/epg-source-id-monitoring.html \
            --csv reports/epg-source-id-monitoring.csv \
            --reports-dir reports

      - name: Publish final merged feed and monitoring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPG Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add feeds/mena.xml.gz feeds/mena.txt feeds/mena.json
          git add reports/latest.json reports/latest.md reports/epg-source-id-monitoring.html reports/epg-source-id-monitoring.csv\n          git add reports/canonical-source-routing.json reports/canonical-source-routing.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize daily EPG feeds $(TZ=Africa/Casablanca date +%F)"
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((n * 2))
          done
          exit 1
