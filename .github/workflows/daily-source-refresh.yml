name: EPG 48h - Daily sequential sources

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Africa/Casablanca"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-daily-sequential
  cancel-in-progress: false

jobs:
  morocco:
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: morocco
      scheduled: false
    secrets: inherit

  check_morocco:
    needs: morocco
    uses: ./.github/workflows/verify-source-refresh.yml
    with:
      source: morocco

  alkass:
    needs: check_morocco
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: alkass
      scheduled: false
    secrets: inherit

  check_alkass:
    needs: alkass
    uses: ./.github/workflows/verify-source-refresh.yml
    with:
      source: alkass

  tunisiatv:
    needs: check_alkass
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: tunisiatv
      scheduled: false
    secrets: inherit

  check_tunisiatv:
    needs: tunisiatv
    uses: ./.github/workflows/verify-source-refresh.yml
    with:
      source: tunisiatv

  bein:
    needs: check_tunisiatv
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: bein
      scheduled: false
    secrets: inherit

  check_bein:
    needs: bein
    uses: ./.github/workflows/verify-source-refresh.yml
    with:
      source: bein

  osn:
    needs: check_bein
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: osn
      scheduled: false
    secrets: inherit

  check_osn:
    needs: osn
    uses: ./.github/workflows/verify-source-refresh.yml
    with:
      source: osn

  shahid:
    needs: check_osn
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: shahid
      scheduled: false
    secrets: inherit

  check_shahid:
    needs: shahid
    uses: ./.github/workflows/verify-source-refresh.yml
    with:
      source: shahid

  elcinema:
    needs: check_shahid
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: elcinema
      scheduled: false
    secrets: inherit

  check_elcinema:
    needs: elcinema
    uses: ./.github/workflows/verify-source-refresh.yml
    with:
      source: elcinema

  rotana:
    needs: check_elcinema
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: rotana
      scheduled: false
    secrets: inherit

  check_rotana:
    needs: rotana
    uses: ./.github/workflows/verify-source-refresh.yml
    with:
      source: rotana

  sport24:
    needs: check_rotana
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: sport24
      scheduled: false
    secrets: inherit

  check_sport24:
    needs: sport24
    uses: ./.github/workflows/verify-source-refresh.yml
    with:
      source: sport24

  dubaiplus:
    needs: check_sport24
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: dubaiplus
      scheduled: false
    secrets: inherit

  check_dubaiplus:
    needs: dubaiplus
    uses: ./.github/workflows/verify-source-refresh.yml
    with:
      source: dubaiplus

  aljazeera:
    needs: check_dubaiplus
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: aljazeera
      scheduled: false
    secrets: inherit

  check_aljazeera:
    needs: aljazeera
    uses: ./.github/workflows/verify-source-refresh.yml
    with:
      source: aljazeera

  tabie:
    needs: check_aljazeera
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: tabie
      scheduled: false
    secrets: inherit

  check_tabie:
    needs: tabie
    uses: ./.github/workflows/verify-source-refresh.yml
    with:
      source: tabie

  starzplay:
    needs: check_tabie
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: starzplay
      scheduled: false
    secrets: inherit

  check_starzplay:
    needs: starzplay
    uses: ./.github/workflows/verify-source-refresh.yml
    with:
      source: starzplay

  stctv:
    needs: check_starzplay
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: stctv
      scheduled: false
    secrets: inherit

  check_stctv:
    needs: stctv
    uses: ./.github/workflows/verify-source-refresh.yml
    with:
      source: stctv

  finalize:
    needs: check_stctv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build canonical MENA feed
        run: python tools/build_derived_feeds.py

      - name: Build final monitoring dashboard
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          feeds=(feeds/*.xml.gz)
          test "${#feeds[@]}" -gt 0
          python tools/monitor_feeds.py "${feeds[@]}" \
            --json reports/latest.json \
            --md reports/latest.md \
            --html reports/epg-source-id-monitoring.html \
            --csv reports/epg-source-id-monitoring.csv \
            --reports-dir reports

      - name: Publish final merged feed and monitoring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPG Finalizer"
          git config user.email "actions@users.noreply.github.com"
          git add feeds/mena.xml.gz feeds/mena.txt feeds/mena.json
          git add reports/latest.json reports/latest.md reports/epg-source-id-monitoring.html reports/epg-source-id-monitoring.csv
          git add reports/canonical-source-routing.json reports/canonical-source-routing.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize daily EPG feeds $(TZ=Africa/Casablanca date +%F)"
          for n in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git rebase origin/main
            sleep $((n * 2))
          done
          exit 1
