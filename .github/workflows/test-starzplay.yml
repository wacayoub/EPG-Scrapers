name: STARZPLAY isolated probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-starzplay.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Compile STARZPLAY adapters
        run: |
          python -m py_compile tools/starzplay_source.py
          python -m py_compile tools/starzplay_hybrid.py
      - name: Probe Arabic and English
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/starz
          for lang in ar en; do
            python tools/starzplay_source.py \
              --lang "$lang" \
              --output "/tmp/starz/$lang.xml" \
              --report "/tmp/starz/$lang.json" \
              --id-index feeds/mena.txt \
              --hours 72
            echo "STARZPLAY_$lang_RC=$?"
            cat "/tmp/starz/$lang.json"
          done
          if grep -q '<programme ' /tmp/starz/ar.xml && grep -q '<programme ' /tmp/starz/en.xml; then
            python tools/starzplay_hybrid.py \
              --arabic /tmp/starz/ar.xml \
              --english /tmp/starz/en.xml \
              --policy config/starzplay-language-policy.json \
              --output /tmp/starz/hybrid.xml \
              --report /tmp/starz/hybrid.json
            echo "HYBRID_RC=$?"
            cat /tmp/starz/hybrid.json
          else
            echo "HYBRID_SKIPPED=no_bilingual_schedule"
          fi
          exit 0
