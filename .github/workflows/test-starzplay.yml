name: STARZPLAY isolated probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-starzplay.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r requirements.txt
      - name: Compile STARZPLAY adapters
        run: |
          python -m py_compile tools/starzplay_source.py
          python -m py_compile tools/starzplay_hybrid.py
      - name: Probe official STARZPLAY hosts
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/starz
          for base in https://www.starzplay.com https://starzplay.com https://playarabia-prod.starzplay.com; do
            tag="$(echo "$base" | sed 's#https://##; s#[^A-Za-z0-9]#_#g')"
            for lang in ar en; do
              python tools/starzplay_source.py \
                --lang "$lang" \
                --base-url "$base" \
                --output "/tmp/starz/$tag.$lang.xml" \
                --report "/tmp/starz/$tag.$lang.json" \
                --id-index feeds/mena.txt \
                --hours 72
              rc=$?
              echo "STARZPLAY_${tag}_${lang}_RC=$rc"
              cat "/tmp/starz/$tag.$lang.json"
            done
          done
          exit 0
