name: Probe STARZPLAY NMS v2 EPG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-starzplay-nms.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe public NMS v2.0/v2.1 EPG
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          from pathlib import Path
          from datetime import datetime, timezone

          base = "https://sp-nms-api.aws.playco.com/api"
          versions = ["v2.0", "v2.1"]
          headers = {
              "User-Agent": "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36",
              "Accept": "application/json,text/plain,*/*",
              "Accept-Language": "ar-MA,ar;q=0.9,en;q=0.7",
              "Origin": "https://www.starzplay.com",
              "Referer": "https://www.starzplay.com/",
              "x-geo-country": "MA",
          }

          def get(url, timeout=20):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      body = r.read(2_000_000)
                      return r.status, r.headers.get("content-type", ""), body
              except urllib.error.HTTPError as e:
                  return e.code, e.headers.get("content-type", "") if e.headers else "", e.read(200_000)
              except Exception as e:
                  return 0, "", str(e).encode()

          def collect_ids(obj):
              out = []
              def walk(v, parent=""):
                  if isinstance(v, dict):
                      for k, x in v.items():
                          kl = str(k).lower()
                          if isinstance(x, (str, int)) and (
                              kl in {"id","channelid","channel_id","channel","epgid","epg_id","contentid","content_id"}
                              or "channelid" in kl or "channel_id" in kl
                          ):
                              s = str(x).strip()
                              if s and s not in out:
                                  out.append(s)
                          walk(x, kl)
                  elif isinstance(v, list):
                      for x in v:
                          walk(x, parent)
              walk(obj)
              return out

          rows = []
          saved = {}
          now_s = int(time.time())
          for version in versions:
              cfg_url = f"{base}/{version}/epg/channel/config"
              status, ctype, body = get(cfg_url)
              row = {
                  "version": version,
                  "kind": "channel_config",
                  "url": cfg_url,
                  "status": status,
                  "content_type": ctype,
                  "bytes": len(body),
                  "sample": body[:1500].decode("utf-8", "replace"),
              }
              ids = []
              if status == 200:
                  try:
                      payload = json.loads(body)
                      ids = collect_ids(payload)
                      row["candidate_ids"] = ids[:100]
                      row["candidate_id_count"] = len(ids)
                      saved[f"{version}-channel-config"] = payload
                  except Exception as e:
                      row["json_error"] = str(e)
              rows.append(row)

              if ids:
                  first = ids[:20]
                  channel_variants = [first[0], ",".join(first)]
                  time_variants = [
                      ("seconds", now_s, now_s + 2*3600),
                      ("milliseconds", now_s*1000, (now_s + 2*3600)*1000),
                  ]
                  for chs in channel_variants:
                      for label, ts0, ts1 in time_variants:
                          for lang in ("en","ar"):
                              q = urllib.parse.urlencode({
                                  "channels": chs,
                                  "ts_start": ts0,
                                  "ts_end": ts1,
                                  "lang": lang,
                                  "pg": "1",
                                  "page": 1,
                                  "limit": 200,
                              })
                              url = f"{base}/{version}/epg/channel/events?{q}"
                              s, ct, b = get(url)
                              ev = {
                                  "version": version,
                                  "kind": "channel_events",
                                  "time_unit": label,
                                  "lang": lang,
                                  "channels_count": len(chs.split(",")),
                                  "url": url,
                                  "status": s,
                                  "content_type": ct,
                                  "bytes": len(b),
                                  "sample": b[:1800].decode("utf-8", "replace"),
                              }
                              if s == 200:
                                  try:
                                      p = json.loads(b)
                                      ev["json_type"] = type(p).__name__
                                      saved[f"{version}-events-{len(chs.split(','))}-{label}-{lang}"] = p
                                  except Exception as e:
                                      ev["json_error"] = str(e)
                              rows.append(ev)
                              time.sleep(0.35)

          Path("reports").mkdir(exist_ok=True)
          report = {
              "generated_utc": datetime.now(timezone.utc).isoformat(),
              "source": "STARZPLAY public NMS EPG",
              "country": "MA",
              "rows": rows,
          }
          Path("reports/starzplay-nms-v2-probe.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          Path("reports/starzplay-nms-v2-payloads.json").write_text(
              json.dumps(saved, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Publish report
        shell: bash
        run: |
          set -e
          git config user.name "epg-diagnostic-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/starzplay-nms-v2-probe.json reports/starzplay-nms-v2-payloads.json
          git commit -m "diagnostic: probe STARZPLAY NMS v2 EPG" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
