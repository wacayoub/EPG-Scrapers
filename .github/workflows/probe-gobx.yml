name: Probe GOBX public guide

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-gobx.yml"
      - "tools/gobx_probe.py"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests beautifulsoup4
      - name: Probe GOBX public pages and endpoints
        run: python tools/gobx_probe.py
      - name: Show GOBX discovery
        run: cat reports/gobx-discovery.md
