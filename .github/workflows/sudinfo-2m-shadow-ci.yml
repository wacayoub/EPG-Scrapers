name: 2M Sudinfo SHADOW parser — non publishing
on:
  push:
    branches:
      - feature/2m-sudinfo-shadow-20261017
    paths:
      - tools/sudinfo_2m_shadow.py
      - tools/test_sudinfo_2m_shadow.py
      - .github/workflows/sudinfo-2m-shadow-ci.yml
  pull_request:
    paths:
      - tools/sudinfo_2m_shadow.py
      - tools/test_sudinfo_2m_shadow.py
      - .github/workflows/sudinfo-2m-shadow-ci.yml
permissions:
  contents: read
jobs:
  shadow-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check beautifulsoup4 lxml
      - run: python -m py_compile tools/sudinfo_2m_shadow.py tools/test_sudinfo_2m_shadow.py
      - run: python -m unittest discover -s tools -p 'test_sudinfo_2m_shadow.py' -v
