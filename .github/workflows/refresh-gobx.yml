name: EPG 48h - GOBX

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-gobx.yml"
      - ".github/workflows/refresh-source-core.yml"
      - "tools/gobx_source.py"
  schedule:
    - cron: "0 5,6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: gobx
      scheduled: ${{ github.event_name == 'schedule' }}
    secrets: inherit
