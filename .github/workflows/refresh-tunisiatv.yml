name: EPG 48h - TunisiaTV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/tunisiatv-refresh-trigger.txt"

permissions:
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: tunisiatv
      scheduled: false
    secrets: inherit
