name: Test 2M only

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-2m-only.yml"
      - "tools/run_2m_only.py"
      - "tools/morocco_epg.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-2m-only
  cancel-in-progress: true

jobs:
  test-2m:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only 2M dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir requests beautifulsoup4 lxml cloudscraper
      - name: Scrape 2M only
        run: python tools/run_2m_only.py --days 1 --output-dir output/2m-only
      - name: Publish only 2M test feed
        run: |
          mkdir -p feeds
          cp output/2m-only/2m.xml.gz feeds/2m.xml.gz
          cp output/2m-only/2m.json feeds/2m.json
      - name: Commit only 2M outputs
        run: |
          git config user.name "EPG Scraper Bot"
          git config user.email "actions@users.noreply.github.com"
          git add feeds/2m.xml.gz feeds/2m.json
          if git diff --cached --quiet; then
            echo "No 2M changes."
          else
            git commit -m "Refresh 2M only"
            git push
          fi
