name: EPG 48h - STARZPLAY
# fallback gate verified
# fallback publish threshold 3 verified

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-starzplay.yml"
  schedule:
    - cron: "0 5,6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: starzplay
      scheduled: ${{ github.event_name == 'schedule' }}
    secrets: inherit
