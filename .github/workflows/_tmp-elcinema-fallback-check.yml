name: TEMP ElCinema fallback check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_tmp-elcinema-fallback-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir requests beautifulsoup4 lxml
      - name: Run fallback against current published ElCinema feed
        run: |
          python tools/elcinema_zero_epg_fallback.py \
            --input feeds/elcinema.xml.gz \
            --output /tmp/elcinema-fallback.xml \
            --report /tmp/elcinema-fallback.json
          cat /tmp/elcinema-fallback.json
