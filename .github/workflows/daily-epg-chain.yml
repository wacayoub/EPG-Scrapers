name: EPG 48h - Daily source postprocessing

on:
  schedule:
    - cron: "15 7 * * *"
      timezone: "Etc/GMT"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/daily-chain-trigger.txt"

permissions:
  contents: write

concurrency:
  group: epg-daily-chain
  cancel-in-progress: false

jobs:
  # Source-engine only. Final MENA/receiver assembly belongs exclusively to
  # wacayoub/EPGManager.
  elcinema_extend:
    if: ${{ always() }}
    uses: ./.github/workflows/elcinema-daily-donors.yml
