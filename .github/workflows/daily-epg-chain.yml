name: EPG 48h - Daily sequential chain

on:
  schedule:
    - cron: "15 7 * * *"
      timezone: "Etc/GMT"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/daily-chain-trigger.txt"

permissions:
  contents: write

concurrency:
  group: epg-daily-chain
  cancel-in-progress: false

jobs:
  # ElCinema runs independently at 01:20 fixed GMT+0 in
  # refresh-elcinema.yml; don't rescrape it at 07:15 here.
  aljazeera:
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: aljazeera
      scheduled: false
    secrets: inherit

  # OSN has its own fixed 01:40 GMT+0; Dubai+ its own fixed 04:44 GMT+0.
  # Neither source is rescraped in this 07:15 GMT+0 daily chain.
  starzplay:
    needs: aljazeera
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: starzplay
      scheduled: false
    secrets: inherit

  tunisiatv:
    needs: starzplay
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: tunisiatv
      scheduled: false
    secrets: inherit

  stctv:
    needs: tunisiatv
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: stctv
      scheduled: false
    secrets: inherit

  alkass:
    needs: stctv
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: alkass
      scheduled: false
    secrets: inherit

  # Sport24 03:05 and Shahid/MBC 03:39 fixed GMT+0 run independently.
  # Do not rescrape either in this 07:15 chain.
  # beIN is scheduled independently at 02:22.
  rotana:
    needs: alkass
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: rotana
      scheduled: false
    secrets: inherit

  morocco:
    needs: rotana
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: morocco
      scheduled: false
    secrets: inherit

  tabie:
    needs: morocco
    if: ${{ always() }}
    uses: ./.github/workflows/refresh-source-core.yml
    with:
      source: tabie
      scheduled: false
    secrets: inherit

  elcinema_extend:
    needs: tabie
    if: ${{ always() }}
    uses: ./.github/workflows/elcinema-daily-donors.yml

  finalize:
    needs: elcinema_extend
    if: ${{ always() }}
    uses: ./.github/workflows/rebuild-mena-derived.yml
