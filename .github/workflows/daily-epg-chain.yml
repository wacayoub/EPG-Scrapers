name: EPG 48h - Daily sequential chain

on:
  schedule:
    - cron: "15 7 * * *"
      timezone: "Etc/GMT"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/daily-chain-trigger.txt"

permissions:
  contents: write

concurrency:
  group: epg-daily-chain
  cancel-in-progress: false

jobs:
  # All 14 direct sources now have their own daily fixed-GMT+0 scrape.
  # Do not rescrape any source in this 07:15 orchestration workflow.
  # Run donor postprocessing after the last source, Tunisia TV at 06:35,
  # then rebuild the derived MENA guide.
  elcinema_extend:
    needs: tabie
    if: ${{ always() }}
    uses: ./.github/workflows/elcinema-daily-donors.yml

  finalize:
    needs: elcinema_extend
    if: ${{ always() }}
    uses: ./.github/workflows/rebuild-mena-derived.yml
