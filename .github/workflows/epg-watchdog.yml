name: EPG Daily Watchdog

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: epg-watchdog
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify today's source feeds and LKG state
        id: health
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Africa/Casablanca")
          now = datetime.now(tz)
          today = now.date()
          sources = [
              "elcinema", "aljazeera", "osn", "dubaiplus", "starzplay",
              "tunisiatv", "stctv", "alkass", "shahid", "sport24",
              "bein", "rotana", "morocco", "tabie",
          ]

          stale_sources = []
          lkg_sources = []
          fresh_sources = []

          def local_day(raw):
              if not raw:
                  return None
              dt = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=timezone.utc)
              return dt.astimezone(tz).date()

          for name in sources:
              feed = Path("feeds") / f"{name}.json"
              feed_day = None
              if feed.exists():
                  try:
                      data = json.loads(feed.read_text(encoding="utf-8"))
                      feed_day = local_day(data.get("generated_utc") or data.get("generated"))
                  except Exception:
                      pass

              if feed_day == today:
                  fresh_sources.append(name)
                  continue

              lkg = Path("reports") / f"{name}-publish-lkg.json"
              accepted_lkg = False
              if lkg.exists():
                  try:
                      data = json.loads(lkg.read_text(encoding="utf-8"))
                      report_day = local_day(data.get("generated_utc"))
                      decision = (data.get("sources", {}).get(name, {}).get("decision", ""))
                      accepted_lkg = report_day == today and decision == "KEEP_LKG"
                  except Exception:
                      pass

              if accepted_lkg:
                  lkg_sources.append(name)
              else:
                  stale_sources.append(name)

          mena = Path("feeds/mena.json")
          mena_fresh = False
          if mena.exists():
              try:
                  data = json.loads(mena.read_text(encoding="utf-8"))
                  mena_fresh = local_day(data.get("generated_utc") or data.get("generated")) == today
              except Exception:
                  pass

          if stale_sources:
              status = "stale_sources"
          elif not mena_fresh:
              status = "mena_stale"
          elif lkg_sources:
              status = "healthy_lkg"
          else:
              status = "healthy"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"status={status}\n")
              fh.write("stale_sources=" + ";".join(stale_sources) + "\n")
              fh.write("lkg_sources=" + ";".join(lkg_sources) + "\n")
              fh.write("fresh_sources=" + ";".join(fresh_sources) + "\n")
              fh.write("mena_fresh=" + ("true" if mena_fresh else "false") + "\n")

          print("WATCHDOG", now.isoformat())
          print("status=", status)
          print("fresh=", fresh_sources)
          print("lkg=", lkg_sources)
          print("stale=", stale_sources)
          print("mena_fresh=", mena_fresh)
          PY

      - name: Check whether recovery chain is already running
        if: steps.health.outputs.status == 'stale_sources'
        id: recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow daily-epg-chain.yml \
            --limit 20 \
            --json status \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          echo "active=$active" >> "$GITHUB_OUTPUT"

      - name: Start one sequential recovery chain
        if: steps.health.outputs.status == 'stale_sources' && steps.recovery.outputs.active == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run daily-epg-chain.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Rebuild MENA only when source feeds are current
        if: steps.health.outputs.status == 'mena_stale'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run rebuild-mena-derived.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Watchdog summary
        if: always()
        shell: bash
        run: |
          {
            echo "## EPG watchdog"
            echo "- Status: ${{ steps.health.outputs.status }}"
            echo "- Fresh sources: ${{ steps.health.outputs.fresh_sources }}"
            echo "- LKG accepted today: ${{ steps.health.outputs.lkg_sources }}"
            echo "- Stale sources: ${{ steps.health.outputs.stale_sources }}"
            echo "- MENA fresh: ${{ steps.health.outputs.mena_fresh }}"
          } >> "$GITHUB_STEP_SUMMARY"
