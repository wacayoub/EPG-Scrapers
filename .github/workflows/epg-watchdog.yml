name: EPG Daily Watchdog

on:
  schedule:
    - cron: "37 8 * * *"
      timezone: "Africa/Casablanca"
    - cron: "37 9 * * *"
      timezone: "Africa/Casablanca"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: epg-watchdog
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify today's production feeds
        id: health
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Africa/Casablanca")
          now = datetime.now(tz)
          today = now.date()
          required = [
              "morocco", "alkass", "tunisiatv", "bein", "osn", "shahid",
              "elcinema", "rotana", "sport24", "dubaiplus", "aljazeera",
              "tabie", "starzplay", "stctv", "mena"
          ]
          stale = []

          for name in required:
              p = Path("feeds") / f"{name}.json"
              if not p.exists():
                  stale.append(f"{name}:manifest-missing")
                  continue
              try:
                  data = json.loads(p.read_text(encoding="utf-8"))
                  raw = data.get("generated_utc") or data.get("generated")
                  if not raw:
                      stale.append(f"{name}:timestamp-missing")
                      continue
                  dt = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  local_day = dt.astimezone(tz).date()
                  if local_day != today:
                      stale.append(f"{name}:stale:{local_day}")
              except Exception as exc:
                  stale.append(f"{name}:invalid-manifest:{exc}")

          status = "healthy" if not stale else "stale"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"status={status}\n")
              fh.write("stale=" + ";".join(stale) + "\n")
          print("WATCHDOG", now.isoformat(), status, stale)
          PY

      - name: Check for recovery already running
        if: steps.health.outputs.status == 'stale'
        id: recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow daily-source-refresh.yml \
            --limit 20 \
            --json status,event \
            --jq '[.[] | select((.status == "queued" or .status == "in_progress") and .event == "workflow_dispatch")] | length')"
          echo "active=$active" >> "$GITHUB_OUTPUT"
          echo "Active recovery runs: $active"

      - name: Dispatch recovery refresh
        if: steps.health.outputs.status == 'stale' && steps.recovery.outputs.active == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Stale feeds: ${{ steps.health.outputs.stale }}"
          gh workflow run daily-source-refresh.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Recovery workflow_dispatch sent."

      - name: Watchdog summary
        if: always()
        shell: bash
        run: |
          {
            echo "## EPG watchdog"
            echo "- Status: ${{ steps.health.outputs.status }}"
            echo "- Stale: ${{ steps.health.outputs.stale }}"
            echo "- Active recovery: ${{ steps.recovery.outputs.active || '0' }}"
          } >> "$GITHUB_STEP_SUMMARY"
